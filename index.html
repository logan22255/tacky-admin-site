<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tacky Control</title>
  <style>
    :root {
      --ink: #e7ffe9;
      --dim: #8dba96;
      --bg: #050807;
      --panel: rgba(8, 18, 14, 0.88);
      --line: rgba(90, 255, 150, 0.28);
      --glow: #3dff8a;
      --amber: #ffb020;
      --hot: #ff4b3e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(61, 255, 138, 0.16), transparent 60%),
        radial-gradient(700px 380px at 100% 0%, rgba(255, 176, 32, 0.08), transparent 55%),
        linear-gradient(180deg, #07110d 0%, var(--bg) 40%);
    }
    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.16) 3px);
      opacity: 0.35;
    }
    main { position: relative; max-width: 1100px; margin: 0 auto; padding: 28px 18px 64px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 42px; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 span { color: var(--glow); }
    .sub { margin: 6px 0 0; color: var(--dim); letter-spacing: 0.18em; font-size: 12px; text-transform: uppercase; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 18px 50px rgba(0, 0, 0, 0.35);
      margin-bottom: 14px;
    }
    .login { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
    label { display: block; margin-bottom: 6px; color: var(--amber); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #030605;
      color: white;
      padding: 12px 14px;
      font: inherit;
    }
    input:focus, textarea:focus { outline: 1px solid var(--glow); }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      background: #143d28;
      color: white;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    button:hover { filter: brightness(1.15); }
    button.warn { background: #6d241d; }
    button.quiet { background: #243028; }
    .searches { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    #status { min-height: 1.2em; color: var(--glow); margin: 8px 0 0; }
    .servers { display: grid; gap: 12px; }
    .server {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: linear-gradient(180deg, rgba(18, 42, 28, 0.7), rgba(5, 10, 8, 0.9));
    }
    .ip {
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 28px;
      color: var(--glow);
      text-shadow: 0 0 18px rgba(61, 255, 138, 0.35);
      word-break: break-all;
    }
    .meta { color: var(--dim); margin-top: 4px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
    .player {
      display: grid;
      grid-template-columns: 1.2fr 1fr auto;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.28);
    }
    .player strong { display: block; }
    .player em { color: var(--dim); font-style: normal; font-family: Consolas, monospace; font-size: 13px; }
    .empty { color: var(--dim); padding: 8px 0 2px; }
    @media (max-width: 720px) {
      h1 { font-size: 30px; }
      .login, .searches, .player { grid-template-columns: 1fr; }
      .ip { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Tacky <span>Control</span></h1>
        <p class="sub">Room console</p>
      </div>
    </header>

    <section class="panel login">
      <div>
        <label for="customId">Menu code</label>
        <input id="customId" maxlength="7" placeholder="AB3-K9Q" autocomplete="off" />
      </div>
      <button id="login">Log in</button>
    </section>

    <section class="panel">
      <div class="searches">
        <div>
          <label for="nameSearch">Name search</label>
          <input id="nameSearch" placeholder="Find a player name" autocomplete="off" />
        </div>
        <div>
          <label for="idSearch">PlayFab ID search</label>
          <input id="idSearch" placeholder="C3A5..." autocomplete="off" />
        </div>
      </div>
      <label for="reason">Reason</label>
      <textarea id="reason" rows="2">Banned from admin site</textarea>
      <div class="actions">
        <button id="kick">Kick</button>
        <button id="ban" class="warn">Ban</button>
        <button id="report" class="quiet">Report</button>
        <button id="shutdown" class="warn">Shut down room</button>
        <button id="grant">Give admin</button>
        <button id="revoke" class="quiet">Remove admin</button>
        <button id="list" class="quiet">Refresh</button>
      </div>
      <p id="status"></p>
    </section>

    <section id="servers" class="servers"></section>
  </main>
  <script src="https://download.playfab.com/PlayFabClientApi.js"></script>
  <script>
    PlayFab.settings.titleId = "1422FE";
    var status = document.getElementById("status");
    var serversEl = document.getElementById("servers");
    var latest = { servers: [] };
    var timer = 0;

    function say(text) { status.textContent = text; }

    function selectedId() {
      return document.getElementById("idSearch").value.trim();
    }

    function run(action) {
      if (!PlayFab._internalSettings.sessionTicket) {
        say("Log in first.");
        return;
      }
      say("Sending " + action + "...");
      PlayFabClientSDK.ExecuteCloudScript({
        FunctionName: "AdminAction",
        FunctionParameter: {
          Action: action,
          PlayFabId: selectedId(),
          Reason: document.getElementById("reason").value.trim(),
          Code: document.getElementById("customId").value.trim(),
          DurationInHours: 8760
        },
        GeneratePlayStreamEvent: true
      }, function (result) {
        var body = result && result.data && result.data.FunctionResult;
        if (result && result.data && result.data.Error) {
          say(result.data.Error.Message || "CloudScript error");
        } else if (body && body.success === false) {
          say(body.message || "Denied");
        } else {
          say(action + " sent.");
          if (body && body.servers) latest = body;
          paint();
        }
      }, function (error) {
        say((error && error.errorMessage) || "Request failed");
      });
    }

    function matches(player) {
      var nameQuery = document.getElementById("nameSearch").value.trim().toLowerCase();
      var idQuery = selectedId().toLowerCase();
      var name = (player.name || "").toLowerCase();
      var id = (player.id || "").toLowerCase();
      if (nameQuery && name.indexOf(nameQuery) < 0) return false;
      if (idQuery && id.indexOf(idQuery) < 0) return false;
      return true;
    }

    function paint() {
      serversEl.textContent = "";
      var rooms = latest.servers || [];
      if (!rooms.length) {
        var empty = document.createElement("div");
        empty.className = "panel empty";
        empty.textContent = "No open rooms yet. Join a room in the game, then refresh.";
        serversEl.appendChild(empty);
        return;
      }
      rooms.forEach(function (room) {
        var card = document.createElement("article");
        card.className = "server";
        var ip = document.createElement("div");
        ip.className = "ip";
        ip.textContent = room.address || "unknown";
        var meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = (room.region || "region") + "  ·  room " + (room.room || "?") + "  ·  " + ((room.players && room.players.length) || 0) + " online";
        card.appendChild(ip);
        card.appendChild(meta);
        var shown = 0;
        (room.players || []).forEach(function (player) {
          if (!matches(player)) return;
          shown++;
          var row = document.createElement("div");
          row.className = "player";
          var who = document.createElement("div");
          var name = document.createElement("strong");
          name.textContent = player.name || "Player";
          var id = document.createElement("em");
          id.textContent = player.id || "no id";
          who.appendChild(name);
          who.appendChild(id);
          var use = document.createElement("button");
          use.className = "quiet";
          use.textContent = "Select";
          use.onclick = function () {
            document.getElementById("idSearch").value = player.id || "";
            document.getElementById("nameSearch").value = player.name || "";
            say("Selected " + (player.name || "player"));
          };
          row.appendChild(who);
          row.appendChild(id.cloneNode(true));
          row.appendChild(use);
          card.appendChild(row);
        });
        if (!shown) {
          var none = document.createElement("div");
          none.className = "empty";
          none.textContent = "No names match that search on this server.";
          card.appendChild(none);
        }
        serversEl.appendChild(card);
      });
    }

    document.getElementById("login").onclick = function () {
      var customId = document.getElementById("customId").value.trim();
      if (!customId) { say("Type the code from the game menu."); return; }
      say("Logging in...");
      PlayFabClientSDK.LoginWithCustomID({ CustomId: "tacky-admin-site", CreateAccount: true }, function () {
        say("Logged in.");
        run("list");
        if (timer) clearInterval(timer);
        timer = setInterval(function () { run("list"); }, 8000);
      }, function (error) {
        say((error && error.errorMessage) || "Login failed.");
      });
    };

    ["kick", "ban", "report", "shutdown", "grant", "revoke", "list"].forEach(function (name) {
      document.getElementById(name).onclick = function () { run(name); };
    });
    document.getElementById("nameSearch").oninput = paint;
    document.getElementById("idSearch").oninput = paint;
    paint();
  </script>
</body>
</html>
