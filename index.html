<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tacky Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #101114;
      --card: #191c22;
      --card-2: #21252e;
      --line: #313744;
      --text: #f6f3ec;
      --muted: #a39e94;
      --hot: #e15a4a;
      --ok: #f0d7a4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Outfit, "Segoe UI", sans-serif;
      font-weight: 400;
      background:
        radial-gradient(1200px 500px at 80% -10%, rgba(240, 215, 164, 0.08), transparent 50%),
        var(--bg);
    }
    main { max-width: 980px; margin: 0 auto; padding: 36px 20px 72px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; }
    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 64px;
      font-weight: 560;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }
    .eyebrow { margin: 0 0 8px; color: var(--ok); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; }
    .counts { display: flex; gap: 18px; color: var(--muted); font-size: 14px; padding-bottom: 8px; }
    .counts b { color: var(--text); font-weight: 600; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .login { display: grid; grid-template-columns: 1fr 140px; gap: 12px; align-items: end; }
    .searches { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
    label { display: block; margin: 0 0 7px; color: var(--muted); font-size: 13px; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #12151b;
      color: var(--text);
      border-radius: 12px;
      padding: 13px 14px;
      font: inherit;
    }
    input::placeholder, textarea::placeholder { color: #6f6a62; }
    input:focus, textarea:focus { outline: 2px solid rgba(240, 215, 164, 0.55); border-color: transparent; }
    textarea { margin-top: 12px; resize: vertical; }
    button {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 12px 14px;
      background: var(--text);
      color: #161616;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { transform: translateY(-1px); }
    button.ghost { background: transparent; color: var(--text); border-color: var(--line); }
    button.hot { background: var(--hot); color: white; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    #status { min-height: 1.2em; margin: 12px 0 0; color: var(--ok); }
    .server { padding: 0; overflow: hidden; }
    .server-top { display: flex; justify-content: space-between; gap: 16px; padding: 18px 18px 14px; }
    .ip {
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 30px;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .room { margin-top: 6px; color: var(--muted); }
    .pill {
      align-self: flex-start;
      background: var(--card-2);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--ok);
      font-size: 13px;
      font-weight: 600;
    }
    .player {
      display: grid;
      grid-template-columns: 1fr 180px auto;
      gap: 12px;
      align-items: center;
      padding: 12px 18px;
      border-top: 1px solid var(--line);
    }
    .player strong { font-weight: 600; }
    .player span { color: var(--muted); font-family: Consolas, monospace; font-size: 13px; }
    .empty { color: var(--muted); padding: 8px 4px; }
    @media (max-width: 720px) {
      h1 { font-size: 46px; }
      .login, .searches, .player, .server-top { grid-template-columns: 1fr; display: grid; }
      .ip { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Tacky</p>
        <h1>Admin</h1>
      </div>
      <div class="counts">
        <div><b id="serverCount">0</b> servers</div>
        <div><b id="playerCount">0</b> players</div>
      </div>
    </header>

    <section class="card login">
      <div>
        <label for="customId">Code from the game menu</label>
        <input id="customId" maxlength="7" placeholder="AB3-K9Q" autocomplete="off" />
      </div>
      <button id="login">Log in</button>
    </section>

    <section class="card">
      <div class="searches">
        <div>
          <label for="nameSearch">Name</label>
          <input id="nameSearch" placeholder="Search players" autocomplete="off" />
        </div>
        <div>
          <label for="idSearch">PlayFab ID</label>
          <input id="idSearch" placeholder="Search or paste an ID" autocomplete="off" />
        </div>
      </div>
      <label for="reason">Reason</label>
      <textarea id="reason" rows="2">Banned from admin site</textarea>
      <div class="actions">
        <button id="kick">Kick</button>
        <button id="ban" class="hot">Ban</button>
        <button id="report" class="ghost">Report</button>
        <button id="shutdown" class="hot">Shut down</button>
        <button id="grant" class="ghost">Give admin</button>
        <button id="revoke" class="ghost">Remove admin</button>
        <button id="list" class="ghost">Refresh</button>
      </div>
      <p id="status"></p>
    </section>

    <section id="servers"></section>
  </main>
  <script src="https://download.playfab.com/PlayFabClientApi.js"></script>
  <script>
    PlayFab.settings.titleId = "1422FE";
    var status = document.getElementById("status");
    var serversEl = document.getElementById("servers");
    var latest = { servers: [] };
    var timer = 0;

    function say(text) { status.textContent = text; }
    function selectedId() { return document.getElementById("idSearch").value.trim(); }

    function run(action) {
      if (!PlayFab._internalSettings.sessionTicket) {
        say("Log in first.");
        return;
      }
      say("Sending " + action + "...");
      PlayFabClientSDK.ExecuteCloudScript({
        FunctionName: "AdminAction",
        FunctionParameter: {
          Action: action,
          PlayFabId: selectedId(),
          Reason: document.getElementById("reason").value.trim(),
          Code: document.getElementById("customId").value.trim(),
          DurationInHours: 8760
        },
        GeneratePlayStreamEvent: true
      }, function (result) {
        var body = result && result.data && result.data.FunctionResult;
        if (result && result.data && result.data.Error) {
          say(result.data.Error.Message || "CloudScript error");
        } else if (body && body.success === false) {
          say(body.message || "Denied");
        } else {
          say(action + " sent.");
          if (body && body.servers) latest = body;
          paint();
        }
      }, function (error) {
        say((error && error.errorMessage) || "Request failed");
      });
    }

    function matches(player) {
      var nameQuery = document.getElementById("nameSearch").value.trim().toLowerCase();
      var idQuery = selectedId().toLowerCase();
      var name = (player.name || "").toLowerCase();
      var id = (player.id || "").toLowerCase();
      if (nameQuery && name.indexOf(nameQuery) < 0) return false;
      if (idQuery && id.indexOf(idQuery) < 0) return false;
      return true;
    }

    function paint() {
      serversEl.textContent = "";
      var rooms = latest.servers || [];
      var people = 0;
      rooms.forEach(function (room) { people += (room.players && room.players.length) || 0; });
      document.getElementById("serverCount").textContent = String(rooms.length);
      document.getElementById("playerCount").textContent = String(people);
      if (!rooms.length) {
        var empty = document.createElement("div");
        empty.className = "card empty";
        empty.textContent = "No open rooms. Join one in the game, then refresh.";
        serversEl.appendChild(empty);
        return;
      }
      rooms.forEach(function (room) {
        var card = document.createElement("article");
        card.className = "card server";
        var top = document.createElement("div");
        top.className = "server-top";
        var copy = document.createElement("div");
        var ip = document.createElement("div");
        ip.className = "ip";
        ip.textContent = room.address || "unknown";
        var meta = document.createElement("div");
        meta.className = "room";
        meta.textContent = "Room " + (room.room || "?") + "  ·  " + (room.region || "region");
        copy.appendChild(ip);
        copy.appendChild(meta);
        var pill = document.createElement("div");
        pill.className = "pill";
        pill.textContent = ((room.players && room.players.length) || 0) + " online";
        top.appendChild(copy);
        top.appendChild(pill);
        card.appendChild(top);
        var shown = 0;
        (room.players || []).forEach(function (player) {
          if (!matches(player)) return;
          shown++;
          var row = document.createElement("div");
          row.className = "player";
          var name = document.createElement("strong");
          name.textContent = player.name || "Player";
          var id = document.createElement("span");
          id.textContent = player.id || "no id";
          var use = document.createElement("button");
          use.className = "ghost";
          use.textContent = "Select";
          use.onclick = function () {
            document.getElementById("idSearch").value = player.id || "";
            document.getElementById("nameSearch").value = player.name || "";
            say("Selected " + (player.name || "player"));
          };
          row.appendChild(name);
          row.appendChild(id);
          row.appendChild(use);
          card.appendChild(row);
        });
        if (!shown) {
          var none = document.createElement("div");
          none.className = "empty";
          none.textContent = "Nobody matches that search.";
          card.appendChild(none);
        }
        serversEl.appendChild(card);
      });
    }

    document.getElementById("login").onclick = function () {
      var customId = document.getElementById("customId").value.trim();
      if (!customId) { say("Type the code from the game menu."); return; }
      say("Logging in...");
      PlayFabClientSDK.LoginWithCustomID({ CustomId: "tacky-admin-site", CreateAccount: true }, function () {
        say("Logged in.");
        run("list");
        if (timer) clearInterval(timer);
        timer = setInterval(function () { run("list"); }, 8000);
      }, function (error) {
        say((error && error.errorMessage) || "Login failed.");
      });
    };

    ["kick", "ban", "report", "shutdown", "grant", "revoke", "list"].forEach(function (name) {
      document.getElementById(name).onclick = function () { run(name); };
    });
    document.getElementById("nameSearch").oninput = paint;
    document.getElementById("idSearch").oninput = paint;
    paint();
  </script>
</body>
</html>
